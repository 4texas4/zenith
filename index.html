<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rat Games</title>
  <link rel="icon" href="media/rat.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --accent-color: #D2B48C;
      --accent-pink: #FFB6C1;
      --bg-dark: #1a1612;
      --bg-brown: #2d251e;
      --text-light: #f5f0eb;
      --text-muted: #a89888;
      --glass-bg: rgba(45, 37, 30, 0.7);
      --glass-border: rgba(210, 180, 140, 0.2);
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Inter", -apple-system, sans-serif;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    /* Rat GIF background */
    #bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    #bg-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('media/rat.gif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.15;
      filter: grayscale(30%);
    }

    #bg-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, var(--bg-dark) 70%);
    }

    /* Trigger styling */
    #menu-trigger {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      transition: left 0.1s ease-out, top 0.1s ease-out, background 0.3s, border-color 0.3s;
      user-select: none;
      touch-action: none;
    }

    body.menu-open #menu-trigger {
      cursor: grab;
      border-color: var(--accent-color);
    }

    body.menu-open #menu-trigger:active {
      cursor: grabbing;
    }

    #menu-trigger img {
      width: 28px;
      height: 28px;
      transition: transform 0.5s ease;
      pointer-events: none;
    }

    body.menu-open #menu-trigger img {
      transform: rotate(360deg);
    }

    /* Menu container */
    #menu-container {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100vh;
      background: rgba(26, 22, 18, 0.9);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 100px 20px 20px 20px;
      box-sizing: border-box;
      transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 900;
    }

    body.menu-open #menu-container {
      left: 0;
    }

    .menu-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 15px;
      margin-left: 10px;
    }

    .menu-item {
      position: relative;
      padding: 14px 18px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.95em;
      font-weight: 500;
      border-radius: 12px;
      transition: all 0.2s ease;
      color: var(--text-muted);
      opacity: 0;
      transform: translateX(-20px);
    }

    body.menu-open .menu-item {
      opacity: 1;
      transform: translateX(0);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-item:nth-child(2) { transition-delay: 0.05s; }
    .menu-item:nth-child(3) { transition-delay: 0.1s; }
    .menu-item:nth-child(4) { transition-delay: 0.15s; }
    .menu-item:nth-child(5) { transition-delay: 0.2s; }

    .menu-item i { font-size: 20px; transition: transform 0.2s; }
    .menu-item:hover { background: var(--glass-bg); color: var(--text-light); padding-left: 22px; }
    .menu-item:hover i { color: var(--accent-color); transform: scale(1.1); }
    .menu-item.active { background: rgba(210, 180, 140, 0.1); color: var(--accent-color); border: 1px solid rgba(210, 180, 140, 0.3); }

    #content-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.menu-open #content-iframe {
      transform: scale(0.98) translateX(20px);
      border-radius: 20px;
    }

    body.is-dragging #content-iframe {
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="bg-container"></div>

  <div id="menu-trigger">
    <img src="media/rat.svg" alt="Rat Games Menu">
  </div>

  <nav id="menu-container">
    <div class="menu-section-label">Explore</div>
    <div class="menu-item" onclick="navigate('app/home.html', this)"><i class="ri-home-line"></i> Home</div>
    <div class="menu-item" onclick="navigate('app/play.html', this)"><i class="ri-gamepad-line"></i> Play</div>
    <div class="menu-item" id="internetBtn"><i class="ri-earth-line"></i> Internet</div>
    <div class="menu-item" onclick="navigate('app/music.html', this)"><i class="ri-music-line"></i> Music</div>
    <div class="menu-item" onclick="navigate('app/movies.html', this)"><i class="ri-clapperboard-line"></i> Movies</div>

    <div style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 20px;">
      <div class="menu-section-label">System</div>
      <div class="menu-item" onclick="navigate('app/feedback.html', this)"><i class="ri-feedback-line"></i> Feedback</div>
      <div class="menu-item" onclick="navigate('app/settings.html', this)"><i class="ri-settings-5-line"></i> Settings</div>
    </div>
  </nav>

  <iframe src="app/home.html" id="content-iframe"></iframe>

  <script>
    let proxy = "";
    const body = document.body;
    const iframe = document.getElementById("content-iframe");
    const trigger = document.getElementById("menu-trigger");
    const menu = document.getElementById("menu-container");

    let isDragging = false;
    let startX, startY, initialX, initialY;
    let hasMoved = false;
    let closeTimeout;

    function openMenu() {
      clearTimeout(closeTimeout);
      body.classList.add('menu-open');
    }

    function closeMenu() {
      closeTimeout = setTimeout(() => {
        if (!isDragging) {
          body.classList.remove('menu-open');
        }
      }, 300);
    }

    trigger.addEventListener('mouseenter', openMenu);
    trigger.addEventListener('mouseleave', closeMenu);
    
    menu.addEventListener('mouseenter', openMenu);
    menu.addEventListener('mouseleave', closeMenu);

    function navigate(url, element) {
      iframe.src = url;
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      if(element) element.classList.add('active');
      body.classList.remove('menu-open');
    }

    trigger.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', endDrag);

    trigger.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
    window.addEventListener('touchmove', (e) => drag(e.touches[0]));
    window.addEventListener('touchend', endDrag);

    function startDrag(e) {
      if (!body.classList.contains('menu-open')) return;

      isDragging = true;
      body.classList.add('is-dragging');
      
      hasMoved = false;
      startX = e.clientX;
      startY = e.clientY;
      initialX = trigger.offsetLeft;
      initialY = trigger.offsetTop;
      
      trigger.style.transition = 'left 0.08s ease-out, top 0.08s ease-out';
      
      clearTimeout(closeTimeout); 
    }

    function drag(e) {
      if (!isDragging) return;
      
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;

      let newX = initialX + dx;
      let newY = initialY + dy;

      newX = Math.max(10, Math.min(newX, window.innerWidth - trigger.offsetWidth - 10));
      newY = Math.max(10, Math.min(newY, window.innerHeight - trigger.offsetHeight - 10));

      trigger.style.left = newX + 'px';
      trigger.style.top = newY + 'px';
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      body.classList.remove('is-dragging');

      snapToGrid();
      closeMenu();
    }

    function snapToGrid() {
      const padding = 20;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const bw = trigger.offsetWidth;
      const bh = trigger.offsetHeight;

      const points = [
        [padding, padding],
        [w / 2 - bw / 2, padding],
        [w - bw - padding, padding],
        [padding, h / 2 - bh / 2],
        [w - bw - padding, h / 2 - bh / 2],
        [padding, h - bh - padding],
        [w / 2 - bw / 2, h - bh - padding],
        [w - bw - padding, h - bh - padding]
      ];

      const currentX = parseInt(trigger.style.left) || padding;
      const currentY = parseInt(trigger.style.top) || padding;

      let closest = points[0];
      let minDist = Infinity;

      points.forEach(p => {
        const dist = Math.sqrt(Math.pow(p[0] - currentX, 2) + Math.pow(p[1] - currentY, 2));
        if (dist < minDist) {
          minDist = dist;
          closest = p;
        }
      });

      trigger.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      trigger.style.left = closest[0] + 'px';
      trigger.style.top = closest[1] + 'px';
    }

    fetch('https://cdn.jsdelivr.net/gh/4texas4/4texas4.github.io@main/CsbLinkWorking.txt')
  .then(res => res.text())
  .then(prefix => {
    proxy = `https://proxy.texas-projects.xyz/`;
    document.getElementById('internetBtn').onclick = () => navigate(proxy, document.getElementById('internetBtn'));
  })
  .catch(err => console.error('Failed to load CSB prefix:', err));
  </script>
</body>
</html>
