<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rat Games | Play</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  html, body { height:100%; }

  html { overflow: hidden; }
  body {
    height:100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    min-width: 0;
    background: #1a1612;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#f5f0eb;
    position:relative;
    padding:40px 20px 110px;
  }

  /* Rat gif background */
  body::before{
    content:'';
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    background: url('../media/rat.gif') center center / cover no-repeat;
    opacity: 0.06;
    z-index:0;
  }

  body::after {
    content:'';
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: radial-gradient(circle at center, transparent 20%, #1a1612 70%);
    z-index:0;
    pointer-events:none;
  }

  h1{
    font-size:4rem;
    font-weight:700;
    text-align:center;
    z-index:1;
    position:relative;
    animation:float 6s ease-in-out infinite;
    text-shadow:0 0 10px rgba(210, 180, 140, 0.2),0 0 20px rgba(210, 180, 140, 0.3);
    margin-bottom:20px;
    max-width: 95%;
    word-break: break-word;
    color: #D2B48C;
  }
  h1 .pink { color: #FFB6C1; }
  @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}

  #search-container{
    width:100%;
    max-width:1400px;
    margin-bottom:16px;
    z-index:1;
    position:relative;
  }
  #search{
    width:100%;
    padding:16px 20px;
    border-radius:12px;
    border:1px solid rgba(210, 180, 140, 0.2);
    font-size:1.1rem;
    outline:none;
    background:rgba(45, 37, 30, 0.5);
    color:#f5f0eb;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
  }
  #search:focus {
    border-color: rgba(210, 180, 140, 0.5);
    box-shadow: 0 0 20px rgba(210, 180, 140, 0.2);
  }
  #search::placeholder{ color:rgba(245, 240, 235, 0.5); }

  /* Tab Switcher */
  .tab-container {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
    z-index: 1;
    position: relative;
  }
  .tab-btn {
    padding: 12px 32px;
    border-radius: 100px;
    border: 1px solid rgba(210, 180, 140, 0.2);
    background: rgba(45, 37, 30, 0.5);
    color: rgba(245, 240, 235, 0.7);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .tab-btn:hover {
    background: rgba(45, 37, 30, 0.8);
    border-color: rgba(210, 180, 140, 0.4);
  }
  .tab-btn.active {
    background: #D2B48C;
    color: #1a1612;
    border-color: #D2B48C;
    box-shadow: 0 0 20px rgba(210, 180, 140, 0.3);
  }

  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:25px;
    max-width:1400px;
    width:100%;
    z-index:1;
    position:relative;
    align-items:start;
  }
  .game-card{
    background:rgba(45, 37, 30, 0.5);
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.28s ease, box-shadow 0.28s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:10px;
    min-height:0;
    border: 1px solid rgba(210, 180, 140, 0.1);
  }
  .game-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 30px rgba(210, 180, 140, 0.15);
    background:rgba(45, 37, 30, 0.7);
    border-color: rgba(210, 180, 140, 0.3);
  }

  .game-card img{
    width:100%;
    aspect-ratio:1 / 1;
    object-fit:cover;
    border-radius:16px;
    margin-bottom:10px;
    display:block;
  }
  .game-card span{
    font-weight:700;
    color:#f5f0eb;
    font-size:1.1rem;
    padding:4px 6px;
    line-height:1.2;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
    max-width:100%;
  }

  footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    gap:28px;
    font-size:1.08rem;
    align-items:center;
    justify-content:center;
    z-index:50;
    backdrop-filter:blur(12px);
    background:linear-gradient(rgba(26, 22, 18, 0.8), rgba(26, 22, 18, 0.6));
    padding:10px 8px;
    border-top:1px solid rgba(210, 180, 140, 0.1);
  }
  footer span{
    display:flex;
    align-items:center;
    position:relative;
    padding:0 6px;
  }
  footer > span:not(:last-child)::after{
    content:'';
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    width:1px;
    height:60%;
    background:rgba(210, 180, 140, 0.2);
  }
  a{ color:#f5f0eb; text-decoration:none }
  a:hover{ text-decoration:underline; color: #D2B48C; }

  @media (max-width:1000px){
    .game-grid{ gap:18px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
    #search-container{ max-width:940px; }
  }
  @media (max-width:700px){
    h1{ font-size:3rem }
    .game-grid{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  }
  @media (max-width:420px){
    h1{ font-size:2.4rem }
    .game-grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
    footer { font-size:1rem; gap:14px; padding:8px 6px; }
    .tab-btn { padding: 10px 20px; font-size: 0.9rem; }
  }

  body::-webkit-scrollbar { width:10px; }
  body::-webkit-scrollbar-track { background:transparent; }
  body::-webkit-scrollbar-thumb { background: rgba(210, 180, 140, 0.15); border-radius:10px; }
</style>
</head>

  const useProxy = localStorage.getItem('useProxy') === 'true';

  function parseList(raw) {
    return raw.trim().split('\n').map(line => {
      const parts = line.split(',');
      const title = parts[0]?.trim() ?? '';
      const img = parts[1]?.trim() ?? '';
      const link = parts.slice(2).join(',').trim() ?? '';
      return [title, img, link];
    }).filter(item => item[0] && item[2]);
  }

  const games = parseList(rawGameList);
  const apps = parseList(rawAppsList);

  let currentTab = 'games';
  const gameGrid = document.getElementById('game-grid');
  const searchInput = document.getElementById('search');
  const tabBtns = document.querySelectorAll('.tab-btn');

  function renderItems(list) {
    gameGrid.innerHTML = '';
    const frag = document.createDocumentFragment();
    
    list.forEach(([title, img, link]) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.setAttribute('role', 'link');
      card.tabIndex = 0;

      const shouldProxy = useProxy || ALWAYS_PROXY.includes(title);
      let finalLink = link;
      if (shouldProxy && !link.includes('7lzhc6-8080.csb.app')) {
        finalLink = `${PROXY_PREFIX}${link}`;
      }

      card.onclick = () => window.location.href = finalLink;
      card.onkeyup = e => { if(e.key === 'Enter') window.location.href = finalLink; };
      
      card.innerHTML = `<img src="${img}" alt="${title}"><span title="${title}">${title}</span>`;
      frag.appendChild(card);
    });
    
    gameGrid.appendChild(frag);
  }

  function filterAndRender() {
    const q = searchInput.value.toLowerCase().trim();
    const list = currentTab === 'games' ? games : apps;
    const filtered = q ? list.filter(([title]) => title.toLowerCase().includes(q)) : list;
    renderItems(filtered);
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      searchInput.placeholder = currentTab === 'games' ? 'Search games...' : 'Search apps...';
      filterAndRender();
    });
  });

  searchInput.addEventListener('input', filterAndRender);

  // Initial render
  filterAndRender();

  // Clock
  function updateTime() {
    const now = new Date();
    let hh = now.getHours();
    const ampm = hh >= 12 ? 'PM' : 'AM';
    hh = hh % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}</span><span class="ampm">${ampm}</span>`;
  }
  setInterval(updateTime, 1000);
  updateTime();

  // Battery
  const batteryText = document.getElementById('battery-text');
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      function upd() { batteryText.textContent = `${Math.round(b.level * 100)}%`; }
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
      upd();
    });
  } else batteryText.textContent = 'N/A';
</script>
