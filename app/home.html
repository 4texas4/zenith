<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rat Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

  body{
    height:100vh;
    background: #1a1612;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#f5f0eb;
    overflow:hidden;
    position:relative;
  }

  .bold {
    font-weight: 900;
  }

  /* Rat gif background */
  body::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: url('../media/rat.gif') center center / cover no-repeat;
    opacity: 0.1;
    z-index:0;
  }

  body::after {
    content:'';
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: radial-gradient(circle at center, transparent 20%, #1a1612 70%);
    z-index:0;
  }

  /* Logo container */
  .logo-container {
    z-index:1;
    position:relative;
    animation:float 6s ease-in-out infinite;
    text-align: center;
  }

  .logo-container img {
    max-width: 500px;
    width: 80vw;
    height: auto;
    filter: drop-shadow(0 0 30px rgba(210, 180, 140, 0.3));
  }

  /* Fallback text if image fails */
  .logo-text {
    font-size:8rem;
    font-weight:700;
    text-align:center;
    color: #D2B48C;
    text-shadow:0 0 10px rgba(210, 180, 140, 0.2),0 0 20px rgba(210, 180, 140, 0.3);
    display: none;
  }

  .logo-text .pink {
    color: #FFB6C1;
  }

  @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-15px)}100%{transform:translateY(0)}}

  /* Footer */
  footer{
    position:absolute;
    bottom:20px;
    display:flex;
    gap:30px;
    font-size:1.5rem;
    align-items:center;
    z-index:1;
    flex-wrap:wrap;
    justify-content:center;
  }

  footer span{
    display:flex;
    align-items:center;
    position:relative;
    padding:0 6px;
  }

  footer span:nth-child(1){ padding-right:6px; }
  footer span:nth-child(2){ padding-left:6px; padding-right:6px; }
  footer span:nth-child(3){ padding-left:6px; }

  footer > span:not(:last-child)::after{
    content:'';
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    width:1px;
    height:60%;
    background:rgba(210, 180, 140, 0.3);
  }

  a{ color:#f5f0eb; text-decoration:none }
  a:hover{ text-decoration:underline; color: #D2B48C; }

  /* Clock */
  #time{ display:flex; align-items:center; gap:2px; }
  .seconds{ color:rgba(245, 240, 235, 0.4); font-weight:400; margin-left:-5px; }
  .ampm{ color:rgba(245, 240, 235, 0.5); font-size:0.8em; margin-left:-8px; }

  /* Battery */
  .battery{ display:flex; align-items:center; gap:3px; }
  .battery svg{ width:24px; height:24px; stroke:#f5f0eb; }

  @media (max-width:600px){
    footer{ flex-direction:column; gap:12px; bottom:10px; font-size:1.1rem }
    footer span:not(:last-child)::after{ display:none }
    .logo-container img { max-width: 280px; }
    .logo-text{ font-size:4rem }
  }
</style>
</head>
<body>
  <div class="logo-container">
    <img src="../media/logo.png" alt="Rat Games" id="logo-img" onerror="document.getElementById('logo-img').style.display='none'; document.getElementById('logo-text').style.display='block';">
    <h1 id="logo-text" class="logo-text bold">RAT<span class="pink">.</span>GAMES</h1>
  </div>

  <footer>
    <span id="time">--:<span class="seconds">--</span><span class="ampm">--</span></span>

    <span class="battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
        <line x1="23" y1="13" x2="23" y2="11"></line>
      </svg>
      <span id="battery-text">--%</span>
    </span>

    <span><a href="https://discord.gg/6Sp3DJMvCU" target="_blank" rel="noopener">Discord</a></span>
  </footer>

<script>
  function updateTime(){
    const now = new Date();
    let hh = now.getHours();
    const ampm = hh >= 12 ? 'PM' : 'AM';
    hh = hh % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}</span><span class="ampm">${ampm}</span>`;
  }
  setInterval(updateTime,1000);
  updateTime();

  const batteryText = document.getElementById('battery-text');
  if (navigator.getBattery){
    navigator.getBattery().then(b => {
      function upd(){ batteryText.textContent = `${Math.round(b.level*100)}%`; }
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
      upd();
    });
  } else { batteryText.textContent='N/A'; }
</script>
</body>
</html>
